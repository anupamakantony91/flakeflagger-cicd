
# ============================================
# GitHub Actions CI/CD Pipeline
# FlakeFlagger Integrated - MSc Research
# ============================================

name: CI Pipeline with FlakeFlagger

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ── JOB 1: Run Tests ──────────────────────
  run-tests:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short

  # ── JOB 2: FlakeFlagger Detection ─────────
  flaky-detection:
    name: FlakeFlagger AI Detection
    runs-on: ubuntu-latest
    needs: run-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install scikit-learn pandas numpy joblib

      - name: Run FlakeFlagger detection
        run: |
          python flakeflagger_predict.py

      - name: Upload FlakeFlagger report
        uses: actions/upload-artifact@v4
        with:
          name: flakeflagger-report
          path: flakeflagger_report.json
